version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=aeroluxe
      - POSTGRES_USER=aeroluxe_user
      - POSTGRES_PASSWORD=aeroluxe_pass
    ports:
      - "5432:5432"

  web:
    build: .
    command: /app/entrypoint.sh
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://aeroluxe_user:aeroluxe_pass@db:5432/aeroluxe
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=*
      - STRIPE_PUBLIC_KEY=pk_test_placeholder
      - STRIPE_SECRET_KEY=sk_test_placeholder
    depends_on:
      - db

volumes:
  postgres_data:
