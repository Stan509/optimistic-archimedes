spec:
  name: aeroluxe-select
  region: nyc

  services:
    - name: web
      github:
        repo: Stan509/optimistic-archimedes
        branch: main
        deploy_on_push: true
      dockerfile_path: Dockerfile
      http_port: 8000
      instance_count: 1
      instance_size_slug: basic-xxs
      routes:
        - path: /

      envs:
        - key: DJANGO_SECRET_KEY
          value: "${DJANGO_SECRET_KEY}"
          type: SECRET
        - key: DJANGO_DEBUG
          value: "False"
        - key: DJANGO_ALLOWED_HOSTS
          value: "${APP_DOMAIN},.ondigitalocean.app,aeroluxeselect-nyc.com,aeroluxeselect-dr.com,www.aeroluxeselect-nyc.com,www.aeroluxeselect-dr.com"
        - key: CSRF_TRUSTED_ORIGINS
          value: "https://${APP_DOMAIN},https://aeroluxeselect-nyc.com,https://aeroluxeselect-dr.com,https://www.aeroluxeselect-nyc.com,https://www.aeroluxeselect-dr.com"
        - key: DATABASE_URL
          scope: RUN_TIME
          value: "${db.DATABASE_URL}"
        - key: USE_SPACES
          value: "True"
        - key: DO_SPACES_KEY
          value: "${DO_SPACES_KEY}"
          type: SECRET
        - key: DO_SPACES_SECRET
          value: "${DO_SPACES_SECRET}"
          type: SECRET
        - key: DO_SPACES_BUCKET
          value: "aeroluxe-media"
        - key: DO_SPACES_REGION
          value: "nyc3"

  databases:
    - name: db
      engine: PG
      production: false
      version: "16"
